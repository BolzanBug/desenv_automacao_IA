services:
  postgres:
    image: postgres:16-alpine
    container_name: pollen_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pollen_db
    ports:
      - "5432:5432"
    volumes:
      - pollen_pg_data:/var/lib/postgresql/data
      - ./artefatos/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pollen_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pollen_pg_data:

